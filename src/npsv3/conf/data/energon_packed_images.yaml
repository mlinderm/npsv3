_target_: npsv3.models.energon.EnergonPackedImageDataModule
# Two ways to specify the data -- set exactly one of these two (see EnergonPackedImageDataModule):
# (a) metadataset_path: a single, pre-combined dataset.yaml that already defines its own real
#     train/val/test splits (e.g. hand-built, or prepared once and reused as-is).
# (b) train_metadataset_paths: one or more dataset.yaml paths written by `prepare_energon_dataset`,
#     per split -- e.g. one per sample -- combined in memory (_build_metadataset). Blended with equal
#     weight when more than one. val/test are each optional; omit to skip that split entirely.
metadataset_path: null
train_metadataset_paths: null
val_metadataset_paths: null
test_metadataset_paths: null
# Node-local scratch for the pixel cache pool. /storage is NFS and must not be used; null -> $TMPDIR
cache_dir: null
# image-slot budget per pack (same meaning as data=packed_images)
batch_size: 256            
w_bucket: ${pileup.image_width}
w_max: ${pileup.image_width}
g_max: ${haplotype.max_diplotypes}
r_max: ${simulation.replicates}
packing_buffer_size: 512
shuffle_buffer_size: 4096
max_samples_per_sequence: 64
num_workers: ${threads}
# Prefetch threads in *each* DataLoader worker
cache_workers: 4
# Pixel cache cap per rank (i.e., per GPU), split evenly across that rank's train/val worker processes. The node-local
# disk request (e.g. the SLURM localdisk gres) must cover this times the number of GPUs.
max_cache_size_gbytes: 54
# Warn, with thread stack dumps, when a worker takes longer than this to produce a batch (null disables). A worker's
# first batch also fills the shuffle and packing buffers, and so gets the longer initial timeout (null -> the same).
watchdog_timeout_seconds: 60
watchdog_initial_timeout_seconds: 600
# Virtual-epoch length in packed batches. null -> runners.train estimates one true pass from the
# dataset's manifests scaled by the DDP world size.
limit_train_batches: null
limit_val_batches: 32
limit_test_batches: 32
# Split `predict` makes a single pass over, and an optional cap on that pass (null -> the whole split)
predict_split: train
limit_predict_batches: null
pad: true
# Exclude training examples (the train split only) with a list of `npsv3.models.filters.ExampleFilter` configs, e.g.
#   data.filters='[{_target_: npsv3.models.filters.LabelDiffersFilter}]'
#   data.filters='[{_target_: npsv3.models.filters.CopositiveFilter, exclude: [suspect]}]'
# LabelDiffersFilter needs the dataset's `comparisons` aux tree (`command=compare`); CopositiveFilter also needs a
# `command=copositive` dataset. Both are checked before training starts. null -> no filtering.
filters: null
# Train with only a subset of each example's genotypes (the train split only), e.g., to compare with images generated with
# `genotype_subset` without regenerating them (see npsv3.images.subsets.GenotypeSubset):
#   data.genotype_subset='{include_homozygous: true}'
# null -> all genotypes.
genotype_subset: null
# Train with co-positive aware targets (the train split only), which need `model.loss` to be CopositiveInfoNCE and
# `command=copositive` train datasets with a `comparisons` aux tree (see npsv3.models.copositive), e.g.,
#   data.copositive='{_target_: npsv3.models.copositive.CopositiveTargets, variant: gated}'
# or, setting both the targets and the loss, `model=paired_packed_inception_copositive_infonce` (and e.g.
# `data.copositive.variant=mask`).
# null -> single-positive targets.
copositive: null
mean: [0.5]
std: [0.5]
