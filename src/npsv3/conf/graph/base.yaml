graph_flank: 1000

kmer_size: 31

# Unique k-mer related parameters
max_edges: 5
exclude_universal: true
canonicalize: false

# Sampling related parameters (partly, adapted from Sirén et al. 2024). The total diplotypes should be h(h+1)/2
max_haplotypes: 8
max_diplotypes: 36

# Strategy for generating the haplotypes to genotype for each example (see npsv3.images.haplotypes):
#   - SampledHaplotypeStrategy: Sample haplotypes from the graph using the sample's k-mer counts
#   - TrueHaplotypeStrategy: For training with high-quality assemblies, the sample's "true" haplotypes, a haplotype with
#     no SVs and the highest k-mer scoring haplotypes created by adding/removing SVs from the true haplotypes.
haplotype_strategy:
  _target_: npsv3.images.haplotypes.SampledHaplotypeStrategy

# When haplotype sampler doesn't sample > 1 distinct haplotypes for a region (e.g. other haplotypes are rare alleles not
# supported by sample's data), borrow haplotypes from the population for any still-missing variant allele instead of
# dropping the region.
population_haplotype_topup: true

population_prior: false
population_excluded_samples: []
haplotype_sampler_params:
  _target_: npsv3.graphs.haplotype.HaplotypeSamplerOverlay.Params
  homozygous_score: 1.0
  absent_score: -0.8
  heterozygous_score: 0.0
  homozygous_discount: 0.9
  het_adjustment: 0.05
  haplotype_prior_weight: 0.5
  panel_fallback_penalty: -2
  transition_prior_alpha: 0.01
  population_state_pool_cap: 8

# Treat missing genotypes as all reference (e.g., assuming variants weren't called in high quality assemblies)
missing_are_ref: false

# Treat genotypes with a failing FT (genotype-level filter) as missing, i.e., "./.", both in the sample genotype paths
# embedded in the graph and in label assignment (where they are then subject to missing_are_ref). If false, filtered
# genotypes are embedded in the graph as is, but the corresponding examples are always unlabeled.
filtered_as_missing: false