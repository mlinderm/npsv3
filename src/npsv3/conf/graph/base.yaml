# Settings for constructing the graphs and their overlays. Unless noted, these are "baked" into the graph shards and so
# have no effect when using pre-generated graphs. See the `haplotype` settings for haplotype generation from those
# graphs.

# K-mer length for all graph operations.
kmer_size: 31

# Unique k-mer related parameters, i.e., the number of edges a k-mer can span, whether to exclude k-mers present in every
# path through the graph and whether to use canonical k-mers (for the overlay and pooled unique k-mer database).
max_edges: 5
exclude_universal: true
canonicalize: false

# Build a population haplotype prior from the VCF's sample genotypes and store it in the graph shards. When using the
# graphs, the haplotype sampler uses the prior if present in the shards (otherwise a uniform prior), regardless of this
# setting.
population_prior: false

# Samples excluded from the population haplotype prior (when building the graphs) and from population haplotype "top-up"
# during haplotype generation.
population_excluded_samples: []

# Treat genotypes with a failing FT (genotype-level filter) as missing, i.e., "./.", both in the sample genotype paths
# embedded in the graph (when building the graphs) and in label assignment. If false, filtered genotypes
# are embedded in the graph as is, but the corresponding examples are always unlabeled.
filtered_as_missing: false
