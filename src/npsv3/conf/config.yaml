defaults:
  - graph: kmc
  - haplotype
  - pileup: unphased_graph
  - simulation
  - compare
  - model: paired_packed_inception_contrastive
  - data: energon_packed_images
  - trainer: paired
  - command: genotype
  - checkpoint_callback: base
  - _self_
  - override hydra/help: custom_help

# Mimic Hydra <= 1.1 by changing the working directory to the output directory
hydra:
  job:
    chdir: true

# Threads to use for multi-threaded commands
threads: 1

# Path to reference FASTA file
reference: ???

# Path prefix of the aligner index (see `pileup.aligner`) used for simulation. A bwa-mem3 index should have a dedicated
# prefix whose basename differs from (and doesn't start with) the reference's, so it doesn't collide in shared memory
# with a bwa index of the reference (e.g. loaded by npsv2).
aligner_index: ${reference}

# If the BWA index is already pre-loaded into shared memory, specify the reference name
shared_reference: null

# Automatically load and unload the BWA index into shared memory
load_reference: false

# Path to stats file created by the preprocess command
stats_path: ???

# Input (inference) VCF file
input: ???

# Background VCF file for generating/tagging haplotypes
background: ???

# Input alignment file (BAM, CRAM)
reads: ???

# Output file for this command
output: ???

# Output format
output_format: null

# Name of the sample
sample: null

# Root path to download pre-trained models.
cache_dir: null

timeout: 1800

torch_compile: false