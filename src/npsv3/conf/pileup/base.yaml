# @package pileup
image_width: 288
image_height: 96
image_channels: [0, 1, 2, 3, 4, 5, 6, 7]

variant_padding: 96
fetch_flank: 1000
realigner_flank: 1000

insert_bases: true

render_snv: true
aligned_base_pixel: 255
soft_clip_base_pixel: 128
match_base_pixel: ${pileup.aligned_base_pixel}
mismatch_base_pixel: 192
insert_base_pixel: 64

insert_size_mean_pixel: 128
insert_size_sd_pixel: 24

binary_allele: false
ref_allele_pixel: 50
amb_allele_pixel: 150
alt_allele_pixel: 250
allele_pixel_range: 100
min_normalized_allele_score: -.inf
max_alleleq: 40

discrete_mapq: true
mapq0_pixel: 64
max_mapq: 60

max_baseq: 40

positive_strand_pixel: 70
negative_strand_pixel: 240

phase_tag: "HP"
haplotag_reads: false
haplotag_sim: false

anchor_min_aligned: 3
assign_delta: 1.0

# Stage 1 ("Cheaper allele evidence for image generation") per-base k-mer allele-evidence channel (8).
# "bwa" preserves today's behavior (channels 6/7 only, via FragmentRealigner); "kmer" replaces the
# per-(fragment, allele) BWA realignment with a single per-read k-mer scan (channel 8 only, no channel
# 6/7 data); "both" runs both engines on every fragment, for the dual-run agreement harness.
allele_evidence: "bwa"
# K-mer size for the evidence index. Deliberately decoupled from graph.kmer_size (which is hard-bound to
# the sample KMC database and on-disk cache directory names); only needs to disambiguate within the
# handful of sampled haplotypes at a region, not across the whole genome.
evidence_kmer_size: 21
# "all": index every k-mer of the sampled (flanked) haplotype sequences, no filtering.
# "local_unique": as "all", but drop any k-mer occurring more than once within a single haplotype.
# "graph_unique": reuse the already-built UniqueKmersOverlay k-mer set (locked to graph.kmer_size).
evidence_kmer_set: "local_unique"
# If > 0, k-mer windows containing a base with quality below this threshold are skipped, same as a hash
# miss. Off by default -- see plan constraint 1 (do not weight or gate votes by default).
evidence_min_baseq: 0
# Channel 8 pixel encoding (plan 1b): pixel 0 means "no informative k-mer window here"; otherwise
# center_pixel +/- pixel_range*contrast, contrast scaled so a saturated tent apex (evidence_kmer_size - 1
# votes) lands near the rails.
kmer_evidence_center_pixel: 128
kmer_evidence_pixel_range: 124

save_realignment_bam_dir: null

# Downsample reads to this fraction of the total reads
downsample: 1.0
aligner: "bwa"

example_fn: "npsv3.images.example.vcf_to_graph_examples"
max_exhaustive_records: 2

# Output layout for generated examples: polylithic meta_ds/imgs_ds trees -- each actor writes a
# gzipped-per-member pixel tar (imgs-%04d-%06d.tar, rotated by the thresholds below) alongside one
# flat, unsharded metadata JSONL file (meta-%04d.jsonl), which `prepare_energon_dataset` later merges
# into the single `meta_ds/train.jsonl` `dataset.yaml` references. The metadata JSONL doubles as the
# offline manifest, so there is no separate manifest file.
# Per-actor shard rotation thresholds for the pixel tar (matches wds.ShardWriter's own defaults).
example_shard_maxcount: 100000
example_shard_maxsize: 3.0e9

generator:
  _target_: npsv3.images.generator.CoverageImageGenerator