# @package _global_
command: train

# Resume an interrupted training run, restoring the full training state (weights, optimizer, LR scheduler, epoch/step
# and data loader position) from a checkpoint. Unlike `model.checkpoint`, which only initializes the weights for
# fine-tuning (training restarts at epoch 0 with a fresh optimizer and schedule), the rest of the configuration must
# match the original run, including the number of GPUs. The two are mutually exclusive.
#
# * null: Train from scratch, unless running under SLURM and `output` contains a `hpc_ckpt_N.ckpt` checkpoint, which
#   Lightning saves on the requeue signal (e.g., `--signal=SIGUSR1@180` before the time limit, or
#   `scancel --signal=USR1 <jobid>`) and then resumes from automatically.
# * "last": Resume from the most recently modified checkpoint in `output`, whether saved by `checkpoint_callback` or
#   the requeue signal. Trains from scratch (with a warning) if there are none, so it is safe to set for the first run.
# * <path>: Resume from that checkpoint, unless `output` contains a more recent checkpoint, e.g., from this same run
#   before it was requeued. To instead roll back to an earlier checkpoint, use a new `output` directory.
#
# Resuming finds checkpoints in a stable `output` directory, so avoid timestamped (e.g., Hydra's default) directories.
# Stale checkpoints in `output` from a previous run will be resumed, so use a new directory to start over.
resume_from: null

# Guard against numerical collapse. Skips (with a warning) any optimizer step whose training loss or gradients are
# non-finite on any DDP rank, stops training after `max_consecutive_nonfinite` consecutive skipped steps or (16-mixed
# only) once the GradScaler scale falls below `min_grad_scale`, and refuses to save a checkpoint with non-finite
# weights/optimizer state or a zero GradScaler scale. Also logs `lr` every step and the pre-clip `grad_norm` (and
# `grad_scale` under 16-mixed) every `trainer.log_every_n_steps` steps. Enabled even if this config is absent; disable
# with `numerical_guard.enabled=false`.
numerical_guard:
  enabled: true
  max_consecutive_nonfinite: 50
  min_grad_scale: 0.00390625  # 2**-8
  # Check every N optimizer steps. Each check costs a gradient-norm reduction and one host-device sync (plus a scalar
  # all-reduce under DDP). N > 1 amortizes that, but a non-finite step between checks is applied rather than skipped.
  check_every_n_steps: 1
  check_checkpoints: true
  log_diagnostics: true
