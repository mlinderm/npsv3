_target_: npsv3.models.paired.PackedVariant
encoder:
  _target_: npsv3.models.paired.InceptionEncoder
  num_channels: ${len:${pileup.image_channels}}
  projection_size: 512
metric:
  _target_: torch.nn.CosineSimilarity
loss:
  _target_: npsv3.models.paired.InfoNCE
  negatives: "all"
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.01
scheduler:
  # Linear warmup to the peak (`optimizer.lr`), then cosine decay to `min_lr_ratio` of the peak by the end of training,
  # stepped every optimizer step. The total steps are derived from the trainer (max_epochs x the virtual epoch length).
  # Specify the warmup as one of `warmup_fraction` (of the total steps) or `warmup_steps`, setting the other to null.
  _target_: npsv3.models.schedulers.warmup_cosine
  _partial_: true
  warmup_fraction: 0.03
  warmup_steps: null
  min_lr_ratio: 0.01
  warmup_start_ratio: 0.0
predictor:
  _target_: npsv3.models.paired.MaximizingPredictor
